<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Buck Bunny · 在线播放</title>
<meta name="description" content="Big Buck Bunny (Blender 开源电影, CC-BY) 在线流媒体播放，无需下载。">
<style>
  :root {
    --bg: #0d0b10;
    --accent: #e0a458;
    --text: #f2ede4;
    --muted: #9a938a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  .backdrop {
    position: fixed; inset: 0; z-index: -1;
    background: url("poster.jpg") center 30% / cover no-repeat;
    filter: blur(22px) brightness(0.35) saturate(1.1);
    transform: scale(1.15);
  }
  .veil {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse at 50% 0%, rgba(13,11,16,0.25) 0%, rgba(13,11,16,0.92) 75%);
  }
  main { max-width: 1024px; margin: 0 auto; padding: 40px 18px 60px; }
  header { text-align: center; margin-bottom: 26px; }
  h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 700; letter-spacing: 1px; }
  .subtitle { margin-top: 10px; color: var(--muted); font-size: clamp(13px, 2.4vw, 16px); }
  .meta {
    display: inline-flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center;
    margin-top: 14px; font-size: 13px; color: var(--text);
  }
  .badge {
    background: rgba(224,164,88,0.14); border: 1px solid rgba(224,164,88,0.45);
    color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 12px;
  }
  .player-shell {
    border-radius: 14px; overflow: hidden;
    background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06);
  }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #fallback {
    margin-top: 16px; padding: 14px 18px; text-align: center;
    background: rgba(224,80,80,0.08); border: 1px solid rgba(224,80,80,0.35);
    border-radius: 10px; font-size: 14px; color: var(--text);
  }
  #fallback a { color: var(--accent); }
  footer {
    margin-top: 26px; text-align: center; color: var(--muted);
    font-size: 12.5px; line-height: 1.9;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .stream-note { margin-top: 8px; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="veil"></div>
  <main>
    <header>
      <h1>Big Buck Bunny</h1>
      <p class="subtitle">Blender 基金会开源动画短片 · CC-BY 授权镜像播放测试</p>
      <div class="meta">
        <span class="badge">全长 10:35</span>
        <span class="badge">720p · H.264</span>
        <span class="badge">CC-BY 合法授权</span>
        <span class="badge">在线播放 · 无需下载</span>
      </div>
    </header>

    <div class="player-shell">
      <video id="player" controls playsinline preload="metadata" poster="poster.jpg">
        <source src="https://github.com/quant202602/mirror-test/releases/latest/download/bbb_720p.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频播放。
      </video>
    </div>

    <div id="fallback" hidden>
      视频加载失败？可能是网络较慢 —— 请稍后重试，或
      <a href="https://www.youtube.com/watch?v=aqz-KE-bpKQ" target="_blank" rel="noopener">在 YouTube 观看原片</a>。

      <div class="stream-note">🎬 视频由 GitHub Release CDN 流式传输，观看过程不会保存文件到您的设备。</div>
      <div>
        <a href="https://peach.blender.org" target="_blank" rel="noopener">© Blender Foundation · peach.blender.org</a>
        · 授权协议 <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
        · <a href="https://github.com/quant202602/mirror-test" target="_blank" rel="noopener">GitHub 仓库</a>
      </div>
    </footer>
  </main>

<script>
  const player = document.getElementById('player');
  const fallback = document.getElementById('fallback');
  player.addEventListener('error', () => { fallback.hidden = false; });
  const source = player.querySelector('source');
  if (source) source.addEventListener('error', () => { fallback.hidden = false; });
</script>
</body>
</html>
